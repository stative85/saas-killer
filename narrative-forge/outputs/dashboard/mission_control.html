<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WENDIGO - Mission Control</title>
    <style>
        :root { --bg: #0a0a0c; --fg: #d1d1d1; --accent: #ff4757; --card: #151518; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 8px; }
        h1, h2 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .ledger-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .ledger-table th, .ledger-table td { text-align: left; padding: 12px; border-bottom: 1px solid #222; font-size: 0.9em; }
        .status-ok { color: #2ed573; }
        .status-err { color: var(--accent); }
        .asset-list { list-style: none; padding: 0; }
        .asset-item { margin-bottom: 10px; padding: 10px; background: #1c1c21; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 0.7em; background: #333; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🐺 WENDIGO MISSION CONTROL</h1>
    
    <div class="grid">
        <!-- LEFT COLUMN: STATUS & ARC MAP -->
        <div class="side-panel">
            <div class="card">
                <h2>📡 ARC DENSITY MAP</h2>
                <div id="arc-map">
                    <p>Loading resonance telemetry...</p>
                </div>
            </div>
            <br>
            <div class="card">
                <h2>🎬 LATEST RENDERS</h2>
                <ul class="asset-list" id="asset-list">
                    <!-- Assets will be injected here -->
                    <li class="asset-item">Waiting for egress...</li>
                </ul>
            </div>
        </div>

        <!-- RIGHT COLUMN: FORENSIC LEDGER -->
        <div class="main-panel">
            <div class="card">
                <h2>⚖️ FORENSIC RUN LEDGER</h2>
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th>RUN_ID</th>
                            <th>TIMESTAMP</th>
                            <th>SCORE</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <!-- Ledger rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Placeholder for local data loading logic
        console.log("[WENDIGO] Dashboard Initialized. Awaiting local JSON link.");
        
        async function loadData() {
            // Future: Fetch ledger.csv and arc_density_map.json
        }
    </script>
</body>
</html>
