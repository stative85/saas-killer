<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WENDIGO - Mission Control</title>
    <style>
        :root { --bg: #0a0a0c; --fg: #d1d1d1; --accent: #ff4757; --card: #151518; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card); border: 1px solid #222; padding: 20px; border-radius: 8px; }
        h1, h2 { color: var(--accent); text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .ledger-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .ledger-table th, .ledger-table td { text-align: left; padding: 12px; border-bottom: 1px solid #222; font-size: 0.9em; }
        .status-ok { color: #2ed573; }
        .status-err { color: var(--accent); }
        .asset-list { list-style: none; padding: 0; }
        .asset-item { margin-bottom: 10px; padding: 10px; background: #1c1c21; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }
        .tag { font-size: 0.7em; background: #333; padding: 2px 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>🐺 WENDIGO MISSION CONTROL</h1>
    
    <div class="grid">
        <!-- LEFT COLUMN: STATUS & ARC MAP -->
        <div class="side-panel">
            <div class="card">
                <h2>📡 ARC DENSITY MAP</h2>
                <div id="arc-map">
                    <p>Loading resonance telemetry...</p>
                </div>
            </div>
            <br>
            <div class="card">
                <h2>🔬 COUNCIL VERDICT</h2>
                <div id="latest-verdict">
                    <p>Awaiting preflight...</p>
                </div>
            </div>
        </div>

        <!-- RIGHT COLUMN: FORENSIC LEDGER -->
        <div class="main-panel">
            <div class="card">
                <h2>⚖️ FORENSIC RUN LEDGER (v1)</h2>
                <table class="ledger-table">
                    <thead>
                        <tr>
                            <th>RUN_ID</th>
                            <th>MODE</th>
                            <th>HOOK</th>
                            <th>CRITIC</th>
                            <th>PREDICTION</th>
                            <th>SLOP</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <!-- Ledger rows injected here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                // Fetch Master Ledger
                const ledgerRes = await fetch('../master_ledger.json');
                const ledger = await ledgerRes.json();
                const tbody = document.getElementById('ledger-body');
                tbody.innerHTML = '';

                ledger.forEach(run => {
                    const row = `<tr>
                        <td>${run.run_id}</td>
                        <td style="font-size:0.8em; color:#888;">${run.mode}</td>
                        <td class="tag">${run.hook_type.toUpperCase()}</td>
                        <td style="font-size:0.8em;">${run.critic_model}</td>
                        <td class="${run.predicted_watch_ratio > 0.6 ? 'status-ok' : ''}">
                            ${(run.predicted_watch_ratio * 100).toFixed(0)}%
                        </td>
                        <td class="${run.slop_detected ? 'status-err' : 'status-ok'}">
                            ${run.slop_detected ? 'FAIL' : 'CLEAN'}
                        </td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
                
                // Update Latest Verdict
                if (ledger.length > 0) {
                    const latest = ledger[0];
                    document.getElementById('latest-verdict').innerHTML = `
                        <div style="font-size:0.9em;">
                            <strong>Run:</strong> ${latest.run_id}<br>
                            <strong>Winner:</strong> <span style="color:#eee; font-style:italic;">"${latest.winning_line}"</span><br>
                            <strong>Flaw:</strong> <span class="status-err">${latest.critical_flaw}</span>
                        </div>
                    `;
                }

                // Fetch Arc Map
                const arcRes = await fetch('../arcs/arc_density_map.json');
                const arcs = await arcRes.json();
                const arcDiv = document.getElementById('arc-map');
                arcDiv.innerHTML = '';
                
                Object.entries(arcs).sort((a,b) => b[1] - a[1]).forEach(([name, count]) => {
                    arcDiv.innerHTML += `<div style="margin-bottom:8px;">
                        <span class="tag">${name.toUpperCase()}</span> 
                        <span style="font-size:0.8em; color:#888;">${count} chunks</span>
                    </div>`;
                });

            } catch (err) {
                console.error("Dashboard Load Error:", err);
            }
        }

        loadData();
        setInterval(loadData, 5000); // Polling every 5s
    </script>
</body>
</html>
