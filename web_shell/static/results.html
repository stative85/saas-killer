<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SAAS KILLER - Run Results</title>
    <style>
        :root { --bg: #0d0e12; --fg: #e0e0e0; --accent: #3a86ff; --err: #ff4757; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--fg); padding: 40px; margin: 0; }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 20px; }
        .run-id { font-family: monospace; color: #888; font-size: 1.2rem; }
        .pack-box { background: #1a1b23; padding: 25px; border-radius: 12px; margin-top: 30px; border: 1px solid #2a2b35; }
        pre { background: #000; padding: 15px; border-radius: 6px; white-space: pre-wrap; font-size: 0.9rem; border: 1px solid #222; color: #aaa; overflow-y: auto; max-height: 400px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        h3 { color: var(--accent); text-transform: uppercase; letter-spacing: 1px; margin-top: 0; }
        .status-pill { padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; background: #333; }
        .status-ok { background: #2ed573; color: #000; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RUN RESULTS</h1>
            <span class="run-id" id="run-display">---</span>
        </div>

        <div class="grid">
            <div class="pack-box">
                <h3>📝 SCRIPT APEX</h3>
                <pre id="script-content">Loading script...</pre>
            </div>
            <div class="pack-box">
                <h3>🚀 DEPLOY PACK</h3>
                <pre id="pack-content">Loading metadata...</pre>
            </div>
        </div>

        <div class="pack-box">
            <h3>⚖️ COUNCIL VERDICT</h3>
            <div id="verdict-status" style="margin-bottom: 15px;"></div>
            <pre id="verdict-content">Loading preflight evidence...</pre>
        </div>
    </div>

    <script>
        async function loadResults() {
            const urlParams = new URLSearchParams(window.location.search);
            const runId = urlParams.get('run_id');
            if (!runId) return;
            
            document.getElementById('run-display').textContent = runId;

            try {
                const res = await fetch(`/api/bundle/${runId}`);
                const data = await res.json();
                
                if (data.status === "error") {
                    document.getElementById('verdict-content').textContent = data.message;
                    return;
                }

                // Hydrate Script (assuming script_path is relative to app root)
                const scriptRes = await fetch(`/api/file?path=${data.script_path}`);
                const scriptText = await scriptRes.text();
                document.getElementById('script-content').textContent = scriptText;

                // Hydrate Deploy Pack
                const packRes = await fetch(`/api/deploy-pack/${runId}`);
                const packData = await packRes.json();
                document.getElementById('pack-content').textContent = JSON.stringify(packData, null, 2);

                // Hydrate Verdict
                document.getElementById('verdict-content').textContent = JSON.stringify({
                    predicted_watch_ratio: data.predicted_watch_ratio,
                    slop_detected: data.slop_detected,
                    critical_flaw: data.critical_flaw,
                    winning_line: data.winning_line
                }, null, 2);
                
                const statusPill = document.getElementById('verdict-status');
                statusPill.innerHTML = `<span class="status-pill ${data.status === 'VALIDATED' ? 'status-ok' : ''}">${data.status}</span>`;

            } catch (err) {
                console.error("Hydration Error:", err);
                document.getElementById('verdict-content').textContent = "Forensic hydration failed.";
            }
        }
        loadResults();
    </script>
</body>
</html>
